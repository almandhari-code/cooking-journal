<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.groq.com; media-src blob:; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<meta name="theme-color" content="#ff8fb8">
<title>Cooking Journal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a href="#/" class="brand">🍳 Cooking Journal</a>
  <span class="nav"><button id="install" class="icon-btn" type="button" aria-label="Install the app" title="Install the app" hidden>📲</button><button id="mute" class="icon-btn" type="button" aria-pressed="false" aria-label="Mute sounds">🔊</button></span>
</header>
<div id="install-ios" class="banner" role="note" hidden><small>📲 Tap Share ⬆️ then “Add to Home Screen”. iPhone only keeps recordings safely for installed apps.</small></div>
<div id="error" class="banner error" role="alert" hidden></div>
<div id="netstatus" class="banner" role="status" hidden></div>
<div id="notice"></div>
<div id="update"></div>
<div id="pending"></div>
<main id="app"></main>
<nav id="tabs" aria-label="Main">
  <a href="#/" data-tab="home" id="tab-home"><span aria-hidden="true">🏠</span>Home</a>
  <a href="#/dishes" data-tab="dishes" id="tab-dishes"><span aria-hidden="true">🍲</span>Dishes</a>
  <button type="button" id="tab-rec" class="tabrec" aria-label="Record"><span aria-hidden="true">🎙️</span><b>Record</b></button>
  <a href="#/pantry" data-tab="pantry" id="tab-pantry"><span aria-hidden="true">🧺</span>Pantry</a>
  <a href="#/me" data-tab="me" id="tab-me"><span aria-hidden="true">🧁</span>Me</a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
